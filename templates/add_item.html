<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Dress - Rented Clothes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .form-container {
            max-width: 500px;
            margin: 120px auto;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid var(--card-border);
        }
        .form-container h2 {
            margin-bottom: 2rem;
            color: var(--accent-color);
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #a0a0a0;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(255,255,255,0.05);
            color: white;
            font-family: inherit;
        }
        .form-actions {
            margin-top: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">RC.</div>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}">Home</a></li>
        </ul>
    </nav>

    <div class="form-container fade-in visible">
        <h2>Add to Catalog</h2>
        <form method="POST">
            <div class="form-group">
                <label>Dress/Item Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Price Per Day ($)</label>
                <input type="number" step="0.01" name="price" required>
            </div>
            <div class="form-group">
                <label>Item Type (Base Image)</label>
                <select name="image_type" required>
                    <option value="dress.png">Dress</option>
                    <option value="suit.png">Suit</option>
                </select>
            </div>
            <div class="form-group">
                <label>Color Tint</label>
                <select name="color">
                    <option value="none">Original</option>
                    <option value="blue">Blue</option>
                    <option value="red">Red</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add to Catalog</button>
            </div>
        </form>
    </div>
</body>
</html>
