<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Collection - Premium 3D Fashion</title>
    <meta name="description" content="Explore our entire exclusive collection of high-end designer rentals in interactive 3D.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Atropos 3D CSS -->
    <link rel="stylesheet" href="https://unpkg.com/atropos@2.0.2/atropos.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
    <!-- Prevent theme flash -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .collection-page-header {
            text-align: center;
            margin: 140px auto 40px;
            max-width: 800px;
            padding: 0 2rem;
        }

        .collection-page-header h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .collection-page-header h1 span {
            color: var(--accent-color);
            font-style: italic;
        }

        .collection-page-header p {
            color: #a0a0a0;
            font-size: 1.1rem;
        }
        
        .collection-grid-section {
            padding: 2rem 5% 8rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="logo" style="text-decoration: none; display: flex; align-items: center;" title="Go to Home">
            <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="3D Logo" style="height: 42px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.4));">
        </a>
        <ul class="nav-links" style="align-items: center; display: flex; gap: 2.5rem;">
            <li>
                <button class="theme-toggle-btn" aria-label="Toggle theme">☀️</button>
            </li>
        </ul>
    </nav>

    <header class="collection-page-header fade-in visible">
        <h1>Our Entire <span>Collection</span></h1>
        <p>Browse through our complete collection of bespoke dresses and luxury tailored suits.</p>
    </header>

    <section class="collection-grid-section">
        <div class="container">
            <div class="cards-container">
                {% for dress in dresses %}
                <a href="{{ url_for('detail', dress_id=dress.id) }}" class="collection-card-link stagger-in visible" style="text-decoration: none; color: inherit; display: block;">
                    <div class="atropos my-atropos collection-card">
                        <div class="atropos-scale">
                            <div class="atropos-rotate">
                                <div class="atropos-inner card-inner">
                                    <div class="card-bg" data-atropos-offset="-5"></div>
                                    <img src="{{ url_for('static', filename='assets/' ~ dress.image_file) }}" alt="{{ dress.name }}" class="card-image" data-atropos-offset="8" style="{{ dress.css_filter }}">
                                    <div class="card-content" data-atropos-offset="3">
                                        <h3>{{ dress.name }}</h3>
                                        <p>{{ dress.description }}</p>
                                        <div class="card-footer">
                                            <span class="price">₹{{ dress.price_per_day }} / day</span>
                                            <span class="btn btn-small">Rent Now</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
                {% endfor %}
            </div>
        </div>
    </section>

    <!-- Atropos 3D JS -->
    <script src="https://unpkg.com/atropos@2.0.2/atropos.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Atropos.js for Deep 3D Cards
            document.querySelectorAll('.my-atropos').forEach((el) => {
                Atropos({
                    el: el,
                    activeOffset: 40,
                    shadowScale: 1.05,
                    highlight: true,
                    rotateXMax: 15,
                    rotateYMax: 15,
                    stretchZ: 10
                });
            });
        });
    </script>
    <!-- Custom JS for theme toggling -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
