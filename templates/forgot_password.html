<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - WearLoop</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="logo" title="WearLoop - Luxury Fashion Rental">
            <img src="{{ url_for('static', filename='assets/logo.png') }}?v=2" alt="WearLoop Logo">
        </a>
        <ul class="nav-links">
            <li><a href="{{ url_for('login') }}">Back to Login</a></li>
            <li>
                <button class="theme-toggle-btn" aria-label="Toggle theme">☀️</button>
            </li>
        </ul>
    </nav>

    <div class="auth-wrapper">
        <div class="form-container fade-in visible">
            <h2>Forgot Password</h2>
            <p class="form-subtitle">Enter your registered email address, and we'll send you an OTP to reset your password.</p>
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <ul class="flashes">
                {% for message in messages %}
                  <li>{{ message }}</li>
                {% endfor %}
                </ul>
              {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="Enter your email address" autocomplete="email">
                </div>
                <div class="form-actions" style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1rem; padding: 0.95rem;">Send Reset OTP</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <!-- 3D Moving Background -->
    <script src="{{ url_for('static', filename='bg3d.js') }}"></script>
    <!-- Custom Theme JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
