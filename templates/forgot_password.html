<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Closet Share</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .form-container {
            max-width: 400px;
            margin: 150px auto;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            text-align: center;
            backdrop-filter: blur(15px);
        }
        .form-container h2 {
            margin-bottom: 1rem;
            color: var(--accent-color);
        }
        .form-container p {
            color: #a0a0a0;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #a0a0a0;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(201, 162, 101, 0.2);
        }
        .flashes {
            color: #ff6b6b;
            list-style: none;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            padding: 0;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">RC.</div>
        <ul class="nav-links">
            <li><a href="{{ url_for('login') }}">Back to Login</a></li>
        </ul>
    </nav>

    <div class="form-container fade-in visible">
        <h2>Forgot Password</h2>
        <p>Enter your registered email address below, and we'll send you an OTP to reset your password.</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="flashes">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="Enter your email address">
            </div>
            <div class="form-actions" style="margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="width:100%; border-radius: 12px;">Send Reset OTP</button>
            </div>
        </form>
    </div>
</body>
</html>
