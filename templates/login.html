<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - WearLoop</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=6">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="logo" title="WearLoop - Luxury Fashion Rental">
            <img src="{{ url_for('static', filename='assets/logo.png') }}?v=2" alt="WearLoop Logo">
        </a>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}">Home</a></li>
            <li><a href="{{ url_for('collection_all') }}">Collection</a></li>
            <li>
                <button class="theme-toggle-btn" aria-label="Toggle theme">☀️</button>
            </li>
        </ul>
    </nav>

    <div class="auth-wrapper">
        <div class="form-container fade-in visible">
            <h2 id="form-title">Welcome Back</h2>
            <p class="form-subtitle" id="form-subtitle">Sign in to access your luxury rental wardrobe</p>
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <ul class="flashes">
                {% for message in messages %}
                  <li>{{ message }}</li>
                {% endfor %}
                </ul>
              {% endif %}
            {% endwith %}

            <form method="POST" id="auth-form">
                <div class="form-group">
                    <label id="username-label">Username / Email</label>
                    <input type="text" name="username" required placeholder="Enter username or email" autocomplete="username">
                </div>
                
                <div class="form-group" id="email-group" style="display: none;">
                    <label>Email Address</label>
                    <input type="email" name="email" id="email-input" placeholder="Enter your email address" autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="Enter password" autocomplete="current-password">
                </div>
                
                <div id="forgot-password-link" style="text-align: right; margin-top: -0.4rem; margin-bottom: 1.5rem;">
                    <a href="{{ url_for('forgot_password') }}" class="form-link">Forgot Password?</a>
                </div>
                
                <div class="form-actions" style="margin-top: 1rem;">
                    <button type="submit" id="primary-btn" name="action" value="login" class="btn btn-primary" style="width: 100%; font-size: 1rem; padding: 0.95rem;">Login</button>
                </div>
                
                <div style="margin-top: 2rem; text-align: center;">
                    <span id="toggle-text" style="color: var(--text-muted); font-size: 0.9rem;">Don't have an account? </span>
                    <a href="#" id="toggle-mode-link" class="form-link" style="font-weight: 700;">Register</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <!-- 3D Moving Background -->
    <script src="{{ url_for('static', filename='bg3d.js') }}"></script>
    <!-- Custom Theme JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <script>
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const emailGroup = document.getElementById('email-group');
        const emailInput = document.getElementById('email-input');
        const usernameLabel = document.getElementById('username-label');
        const forgotPasswordLink = document.getElementById('forgot-password-link');
        const primaryBtn = document.getElementById('primary-btn');
        const toggleText = document.getElementById('toggle-text');
        const toggleModeLink = document.getElementById('toggle-mode-link');
        
        let isLoginMode = true;
        
        toggleModeLink.addEventListener('click', function(e) {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            
            const container = document.querySelector('.form-container');
            container.style.opacity = 0;
            container.style.transform = 'translateY(8px)';
            container.style.transition = 'all 0.22s cubic-bezier(0.16, 1, 0.3, 1)';
            
            setTimeout(() => {
                if (isLoginMode) {
                    formTitle.textContent = 'Welcome Back';
                    formSubtitle.textContent = 'Sign in to access your luxury rental wardrobe';
                    emailGroup.style.display = 'none';
                    emailInput.required = false;
                    usernameLabel.textContent = 'Username / Email';
                    forgotPasswordLink.style.display = 'block';
                    primaryBtn.textContent = 'Login';
                    primaryBtn.value = 'login';
                    toggleText.textContent = "Don't have an account? ";
                    toggleModeLink.textContent = 'Register';
                } else {
                    formTitle.textContent = 'Create Account';
                    formSubtitle.textContent = 'Join WearLoop for exclusive designer rentals';
                    emailGroup.style.display = 'block';
                    emailInput.required = true;
                    usernameLabel.textContent = 'Username';
                    forgotPasswordLink.style.display = 'none';
                    primaryBtn.textContent = 'Register';
                    primaryBtn.value = 'register';
                    toggleText.textContent = 'Already have an account? ';
                    toggleModeLink.textContent = 'Login';
                }
                container.style.opacity = 1;
                container.style.transform = 'translateY(0)';
            }, 220);
        });
    </script>
</body>
</html>
